<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日惊喜互动</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #canvas {
            border: 1px solid #333;
            background-color: #111;
        }
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }
        #permission-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 18px;
            z-index: 10;
            text-align: center;
            padding: 20px;
        }
        #permission-screen button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #music-control {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 5;
        }
        #music-control::before {
            content: '🎵';
            font-size: 20px;
        }
        #music-control.muted::before {
            content: '🔇';
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="400" height="600"></canvas>
    <div id="start-screen">点击屏幕开始</div>
    <div id="permission-screen">
        <div>
            <p>请允许访问麦克风以使用吹气功能</p>
            <button id="allow-mic">允许访问麦克风</button>
        </div>
      </div>
    <!-- 音乐控制按钮 -->
    <div id="music-control"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const permissionScreen = document.getElementById('permission-screen');
        const allowMicBtn = document.getElementById('allow-mic');
        const musicControl = document.getElementById('music-control');
        const backgroundMusic = document.getElementById('background-music');

        let isMusicPlaying = false;
        musicControl.classList.add('muted');

        function resizeCanvas() {
            const container = canvas.parentElement;
            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const scale = Math.min(containerWidth / 400, containerHeight / 600);
            const newWidth = 400 * scale;
            const newHeight = 600 * scale;
            canvas.style.width = `${newWidth}px`;
            canvas.style.height = `${newHeight}px`;
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 全局状态管理
        let gameState = {
            isBlown: false,           // 蜡烛是否熄灭
            isEffectActive: false,    // 是否正在显示特效
            isProcessing: false,      // 是否正在处理交互
            canListenForBlow: true,   // 是否可以监听吹气
            lastInteractionTime: 0,   // 上次交互时间
            blowCounter: 0            // 吹气计数器
        };

        const flame = {
            x: canvas.width / 2,
            y: canvas.height / 2 - 55,
            width: 20,
            height: 30,
            flickerOffset: 0,
            flickerSpeed: 0.1,
            opacity: 1
        };

        const fireworks = [];
        const redPackets = [];
        const stockData = [];
        const goldIngots = [];
        
        const MAX_RED_PACKETS = 50;
        const MAX_GOLD_INGOTS = 40;
        const EFFECT_DURATION = 10000;
        let effectStartTime = null;
        let currentEffect = null;
        let animationId;
        let audioContext;
        let analyser;
        let microphone;
        let dataArray;
        let isInitialized = false;
        let isAudioContextInitialized = false;
        
        const BLOW_THRESHOLD = 30;    // 音量阈值
        const BLOW_FRAMES = 5;        // 需要连续超过阈值的帧数

        async function initAudio() {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                microphone = audioContext.createMediaStreamSource(stream);
                microphone.connect(analyser);
                isAudioContextInitialized = true;
                permissionScreen.style.display = 'none';
                if (!animationId) animationId = requestAnimationFrame(animate);
            } catch (error) {
                console.error('无法访问麦克风:', error);
                alert('无法访问麦克风，吹气功能将不可用。');
                permissionScreen.style.display = 'none';
                if (!animationId) animationId = requestAnimationFrame(animate);
            }
        }

        function toggleBackgroundMusic() {
            if (isMusicPlaying) {
                backgroundMusic.pause();
                musicControl.classList.add('muted');
            } else {
                if (audioContext && audioContext.state === 'suspended') audioContext.resume();
                backgroundMusic.play();
                musicControl.classList.remove('muted');
            }
            isMusicPlaying = !isMusicPlaying;
        }

        function drawCake() {
            ctx.save();
            ctx.fillStyle = '#FF69B4';
            ctx.fillRect(canvas.width / 2 - 80, canvas.height / 2 + 50, 160, 40);
            ctx.fillStyle = '#FFFF00';
            ctx.fillRect(canvas.width / 2 - 70, canvas.height / 2 + 20, 140, 30);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(canvas.width / 2 - 60, canvas.height / 2 - 10, 120, 30);
            ctx.strokeStyle = '#FF1493';
            ctx.lineWidth = 2;
            ctx.strokeRect(canvas.width / 2 - 80, canvas.height / 2 + 50, 160, 40);
            ctx.strokeRect(canvas.width / 2 - 70, canvas.height / 2 + 20, 140, 30);

            ctx.fillStyle = '#FF0000';
            ctx.fillRect(canvas.width / 2 - 5, canvas.height / 2 - 60, 10, 50);
            ctx.fillStyle = '#FF6666';
            ctx.fillRect(canvas.width / 2 - 5, canvas.height / 2 - 60, 10, 5);

        }

        function drawFlame() {
            if (gameState.isBlown) return;
            ctx.save();
            const time = Date.now() * 0.001;
            flame.flickerOffset = Math.sin(time * flame.flickerSpeed) * 3 + Math.sin(time * flame.flickerSpeed * 1.5) * 2;
            const dynamicHeight = flame.height + Math.sin(time * 3) * 5;
            const dynamicWidth = flame.width + Math.cos(time * 2) * 3;
            const glowGradient = ctx.createRadialGradient(
                flame.x + flame.flickerOffset, flame.y - dynamicHeight / 2, 0,
                flame.x + flame.flickerOffset, flame.y - dynamicHeight / 2, dynamicWidth * 3
            );
            glowGradient.addColorStop(0, 'rgba(255,255,255,0.3)');
            glowGradient.addColorStop(0.3, 'rgba(255,255,0,0.2)');
            glowGradient.addColorStop(0.6, 'rgba(255,165,0,0.1)');
            glowGradient.addColorStop(1, 'rgba(255,69,0,0)');
            ctx.fillStyle = glowGradient;
            ctx.beginPath();
            ctx.arc(flame.x + flame.flickerOffset, flame.y - dynamicHeight / 2, dynamicWidth * 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(flame.x + flame.flickerOffset - dynamicWidth / 2, flame.y);
            for (let i = 0; i < 3; i++) {
                const x = flame.x + flame.flickerOffset - dynamicWidth / 2 + (dynamicWidth / 3) * i;
                const y = flame.y - (dynamicHeight / 3) * (i + 1) + Math.sin(time * 5 + i) * 3;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(flame.x + flame.flickerOffset + Math.sin(time * 4) * 3, flame.y - dynamicHeight - Math.sin(time * 3) * 5);
            for (let i = 2; i >= 0; i--) {
                const x = flame.x + flame.flickerOffset + dynamicWidth / 2 - (dynamicWidth / 3) * i;
                const y = flame.y - (dynamicHeight / 3) * (i + 1) + Math.cos(time * 5 + i) * 3;
                ctx.lineTo(x, y);
            }
            ctx.closePath();
            const flameGradient = ctx.createLinearGradient(
                flame.x + flame.flickerOffset - dynamicWidth / 2, flame.y,
                flame.x + flame.flickerOffset + dynamicWidth / 2, flame.y - dynamicHeight
            );
            flameGradient.addColorStop(0, 'rgba(255,69,0,0.8)');
            flameGradient.addColorStop(0.4, 'rgba(255,165,0,0.9)');
            flameGradient.addColorStop(0.8, 'rgba(255,255,0,0.9)');
            flameGradient.addColorStop(1, 'rgba(255,255,255,0.8)');
            ctx.fillStyle = flameGradient;
            ctx.fill();
            ctx.restore();
        }

        function drawSmoke() {
            if (!gameState.isBlown) return;
            ctx.save();
            const time = Date.now() * 0.001;
            const smokeX = flame.x;
            const smokeY = flame.y;
            ctx.strokeStyle = 'rgba(150,150,150,0.5)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 3; i++) {
                const offset = i * 8;
                ctx.beginPath();
                ctx.moveTo(smokeX, smokeY);
                for (let j = 0; j < 5; j++) {
                    const x = smokeX + Math.sin(time + j * 0.5 + i) * 10 + offset;
                    const y = smokeY - j * 15 - Math.cos(time + j * 0.3 + i) * 5;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }
            if (!window.smokeParticles) window.smokeParticles = [];
            if (Math.random() < 0.3) {
                window.smokeParticles.push({
                    x: smokeX + Math.random() * 10 - 5,
                    y: smokeY,
                    vx: Math.random() * 2 - 1,
                    vy: -Math.random() * 2 - 1,
                    size: Math.random() * 3 + 2,
                    life: 1,
                    decay: Math.random() * 0.01 + 0.005
                });
            }
            for (let i = window.smokeParticles.length - 1; i >= 0; i--) {
                const p = window.smokeParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx += (Math.random() * 0.2 - 0.1);
                p.life -= p.decay;
                if (p.life > 0) {
                    ctx.globalAlpha = p.life * 0.5;
                    ctx.fillStyle = 'rgba(200,200,200,0.8)';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    window.smokeParticles.splice(i, 1);
                }
            }
            ctx.restore();
        }

        function drawBirthdayText() {
            if (!gameState.isBlown) return;
            ctx.save();
            const time = Date.now() * 0.001;
            const floatOffset = Math.sin(time * 2) * 10;
            ctx.font = 'bold 36px Arial';
            ctx.fillStyle = '#FF0000';
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.strokeText('祝你生日快乐', canvas.width / 2, canvas.height - 100 + floatOffset);
            ctx.fillText('祝你生日快乐', canvas.width / 2, canvas.height - 100 + floatOffset);
            ctx.restore();
        }

        function createFirework() {
            const firework = {
                x: Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
                y: canvas.height,
                vx: Math.random() * 2 - 1,
                vy: -Math.random() * 8 - 8,
                explosionRadius: 0,
                maxExplosionRadius: Math.random() * 50 + 30,
                particles: [],
                sparkles: [],
                exploded: false,
                color: `hsl(${Math.random() * 360},100%,50%)`,
                coreColor: `hsl(${Math.random() * 360},100%,70%)`,
                trail: []
            };
            fireworks.push(firework);
        }

        function updateAndDrawFireworks() {
            ctx.save();
            for (let i = fireworks.length - 1; i >= 0; i--) {
                const f = fireworks[i];
                if (!f.exploded) {
                    f.x += f.vx;
                    f.y += f.vy;
                    f.vy += 0.05;
                    if (Math.random() < 0.3) {
                        f.trail.push({x:f.x,y:f.y,life:1,decay:0.05});
                    }
                    for (let j = f.trail.length - 1; j >= 0; j--) {
                        const t = f.trail[j];
                        t.life -= t.decay;
                        if (t.life > 0) {
                            ctx.globalAlpha = t.life * 0.5;
                            ctx.fillStyle = f.coreColor;
                            ctx.beginPath();
                            ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
                            ctx.fill();
                        } else {
                            f.trail.splice(j,1);
                        }
                    }
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = f.coreColor;
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    const g = ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,8);
                    g.addColorStop(0,f.coreColor);
                    g.addColorStop(1,'rgba(255,255,255,0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(f.x,f.y,8,0,Math.PI*2);
                    ctx.fill();
                    if (f.vy >=0 || f.y < canvas.height*0.3) {
                        f.exploded = true;
                        for(let j=0;j<100;j++){
                            const a = Math.random()*Math.PI*2;
                            const s = Math.random()*6+3;
                            const c = `hsl(${(parseInt(f.color.replace('hsl(','').split(',')[0])+Math.random()*30-15)%360},100%,${50+Math.random()*30}%)`;
                            f.particles.push({x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:Math.random()*0.02+0.01,size:Math.random()*3+1,color:c});
                        }
                        for(let j=0;j<50;j++){
                            const a = Math.random()*Math.PI*2;
                            const s = Math.random()*3+1;
                            f.sparkles.push({x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:Math.random()*0.04+0.02,size:Math.random()*2+1});
                        }
                        f.shockwave = {radius:0,maxRadius:f.maxExplosionRadius*0.5,opacity:1};
                    }
                } else {
                    if(f.shockwave){
                        f.shockwave.radius +=2;
                        f.shockwave.opacity -=0.02;
                        if(f.shockwave.opacity>0){
                            ctx.globalAlpha = f.shockwave.opacity;
                            ctx.strokeStyle = f.coreColor;
                            ctx.lineWidth=2;
                            ctx.beginPath();
                            ctx.arc(f.x,f.y,f.shockwave.radius,0,Math.PI*2);
                            ctx.stroke();
                        }
                    }
                    for(let j=f.particles.length-1;j>=0;j--){
                        const p = f.particles[j];
                        p.vx*=0.98; p.vy*=0.98; p.vy+=0.05;
                        p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
                        if(p.life>0){
                            ctx.globalAlpha = p.life*0.3;
                            ctx.fillStyle = p.color;
                            ctx.beginPath(); ctx.arc(p.x,p.y,p.size*3,0,Math.PI*2); ctx.fill();
                            ctx.globalAlpha = p.life;
                            ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
                            ctx.globalAlpha = p.life*0.5;
                            ctx.strokeStyle = p.color; ctx.lineWidth=p.size*0.5;
                            ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*3,p.y-p.vy*3); ctx.stroke();
                        }else{
                            f.particles.splice(j,1);
                        }
                    }
                    for(let j=f.sparkles.length-1;j>=0;j--){
                        const s = f.sparkles[j];
                        s.vx*=0.95; s.vy*=0.95; s.vy+=0.02;
                        s.x+=s.vx; s.y+=s.vy; s.life-=s.decay;
                        if(s.life>0){
                            ctx.globalAlpha = s.life;
                            ctx.fillStyle='#FFF';
                            ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
                        }else{
                            f.sparkles.splice(j,1);
                        }
                    }
                    if(f.particles.length===0 && f.sparkles.length===0){
                        fireworks.splice(i,1);
                    }
                }
            }
            ctx.restore();
        }

        function createRedPacket(){
            if(redPackets.length >= MAX_RED_PACKETS) return;
            redPackets.push({
                x:Math.random()*canvas.width, y:-20, width:30, height:40,
                vx:Math.random()*2-1, vy:Math.random()*2+2, rotation:0, rotationSpeed:Math.random()*0.1-0.05
            });
        }

        function updateAndDrawRedPackets(){
            ctx.save();
            for(let i=redPackets.length-1;i>=0;i--){
                const p=redPackets[i];
                p.x+=p.vx; p.y+=p.vy; p.rotation+=p.rotationSpeed;
                if(p.y>canvas.height+20){redPackets.splice(i,1);continue;}
                ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rotation);
                ctx.fillStyle='#F00'; ctx.fillRect(-p.width/2,-p.height/2,p.width,p.height);
                ctx.strokeStyle='#FFD700'; ctx.lineWidth=2; ctx.strokeRect(-p.width/2,-p.height/2,p.width,p.height);
                ctx.fillStyle='#FFD700'; ctx.fillRect(-p.width/2,-2,p.width,4);
                ctx.fillStyle='#FFD700'; ctx.font='12px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText('福',0,0);
                ctx.restore();
            }
            ctx.restore();
        }

        function createGoldIngot(){
            if(goldIngots.length >= MAX_GOLD_INGOTS) return;
            goldIngots.push({
                x:Math.random()*canvas.width, y:-40, width:40, height:25,
                vx:Math.random()*2-1, vy:Math.random()*3+3, rotation:0, rotationSpeed:Math.random()*0.1-0.05,
                shine:Math.random()*Math.PI*2, glowIntensity:Math.random()*0.3+0.2
            });
        }

        function updateAndDrawGoldIngots(){
            ctx.save();
            for(let i=goldIngots.length-1;i>=0;i--){
                const ing=goldIngots[i];
                ing.x+=ing.vx; ing.y+=ing.vy; ing.rotation+=ing.rotationSpeed; ing.shine+=0.1;
                ing.glowIntensity=0.2+Math.sin(Date.now()*0.003+i)*0.2;
                if(ing.y>canvas.height+40){goldIngots.splice(i,1);continue;}
                ctx.save(); ctx.translate(ing.x,ing.y); ctx.rotate(ing.rotation);
                ctx.globalAlpha=ing.glowIntensity; ctx.fillStyle='#FFD700';
                ctx.beginPath(); ctx.ellipse(0,0,ing.width*0.6,ing.height*0.8,0,0,Math.PI*2); ctx.fill();
                ctx.globalAlpha=1;
                ctx.beginPath();
                ctx.moveTo(-ing.width*0.45,ing.height*0.3);
                ctx.quadraticCurveTo(0,ing.height*0.5,ing.width*0.45,ing.height*0.3);
                ctx.quadraticCurveTo(ing.width*0.5,ing.height*0.1,ing.width*0.4,-ing.height*0.2);
                ctx.quadraticCurveTo(ing.width*0.2,-ing.height*0.4,0,-ing.height*0.3);
                ctx.quadraticCurveTo(-ing.width*0.2,-ing.height*0.4,-ing.width*0.4,-ing.height*0.2);
                ctx.quadraticCurveTo(-ing.width*0.5,ing.height*0.1,-ing.width*0.45,ing.height*0.3);
                ctx.closePath();
                const g=ctx.createRadialGradient(0,-ing.height*0.1,0,0,0,ing.width*0.5);
                g.addColorStop(0,'#FFDF5E'); g.addColorStop(0.4,'#FFD700');
                g.addColorStop(0.7,'#FFC107'); g.addColorStop(1,'#FFA000');
                ctx.fillStyle=g; ctx.fill();
                ctx.strokeStyle='#FF8C00'; ctx.lineWidth=1; ctx.stroke();
                ctx.globalAlpha=0.7; ctx.fillStyle='#FFF';
                ctx.beginPath(); ctx.arc(0,-ing.height*0.15,ing.width*0.15,0,Math.PI*2); ctx.fill();
                ctx.restore();
            }
            ctx.restore();
        }

        let stockChartState = {startTime:null,duration:4000,completed:false};
        function initStockData(){stockData.length=0;stockChartState.startTime=Date.now();stockChartState.completed=false;}
        function updateAndDrawStockChart(){
            if(!stockChartState.startTime)return;
            const e=Date.now()-stockChartState.startTime;
            const p=Math.min(e/stockChartState.duration,1);
            ctx.save();
            ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            const ex=canvas.width*p;
            if(ex>0){
                drawStockLine(ex,p);
                if(p>0.3)drawDollarSigns(p);
                if(p>0.6)drawStockText(p);
            }
            if(p>=1 && !stockChartState.completed)stockChartState.completed=true;
            ctx.restore();
        }
        function drawStockLine(ex,p){
            const by=canvas.height*0.7;
            const th=by*0.6;
            ctx.strokeStyle='#F00'; ctx.lineWidth=4; ctx.lineCap='round'; ctx.lineJoin='round';
            ctx.shadowColor='#F00'; ctx.shadowBlur=10;
            ctx.beginPath(); ctx.moveTo(0,by);
            const seg=Math.floor(ex/40);
            for(let i=1;i<=seg;i++){
                const x=i*40;
                const r=i/seg;
                const hp=Math.pow(r,0.8);
                const bo=th*hp*p;
                const f=i%3===0?-10:(i%3===1?5:0);
                const y=by-bo+f;
                ctx.lineTo(x,y);
            }
            if(seg*40<ex){
                const x=ex;
                const r=seg/Math.max(1,seg);
                const hp=Math.pow(r,0.8);
                const bo=th*hp*p;
                const f=((seg+1)%3===0?-10:((seg+1)%3===1?5:0));
                const y=by-bo+f;
                ctx.lineTo(x,y);
            }
            ctx.stroke();
            ctx.shadowBlur=0;
            ctx.fillStyle='#F00';
            for(let i=0;i<=seg;i++){
                const x=i*40;
                const r=i/Math.max(1,seg);
                const hp=Math.pow(r,0.8);
                const bo=th*hp*p;
                const f=i%3===0?-10:(i%3===1?5:0);
                const y=by-bo+f;
                ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#FFF'; ctx.beginPath(); ctx.arc(x,y,1,0,Math.PI*2); ctx.fill();
                ctx.fillStyle='#F00';
            }
        }
        function drawDollarSigns(p){
            const by=canvas.height*0.7;
            ctx.textAlign='center'; ctx.textBaseline='middle';
            for(let i=0;i<5;i++){
                const r=i/4;
                const x=canvas.width*0.1+(canvas.width*0.8)*r;
                const vp=Math.max(0,(p-0.3)/0.7);
                if(x<canvas.width*p*0.9){
                    const y=by-50-Math.sin(r*Math.PI)*30;
                    const s=15+r*20*vp;
                    ctx.globalAlpha=vp;
                    ctx.fillStyle='#FFD700'; ctx.font=`bold ${s}px Arial`;
                    ctx.shadowColor='#FFD700'; ctx.shadowBlur=8;
                    ctx.fillText('$',x,y);
                }
            }
            ctx.shadowBlur=0;
        }
        function drawStockText(p){
            const tp=Math.max(0,(p-0.6)/0.4);
            ctx.globalAlpha=tp;
            ctx.fillStyle='#F00'; ctx.font='bold 36px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.shadowColor='#F00'; ctx.shadowBlur=12;
            ctx.fillText('股票大涨 +1000%',canvas.width/2,canvas.height*0.3);
            ctx.shadowBlur=0;
        }

        function triggerRandomEffect(){
            stopCurrentEffect();
            const effects = ['fireworks', 'redPackets', 'stockChart', 'goldIngots'];
            currentEffect = effects[Math.floor(Math.random() * effects.length)];
            effectStartTime = Date.now();
            gameState.isEffectActive = true;
            
            if(currentEffect === 'fireworks'){
                const timer = setInterval(()=>{
                    if(gameState.isEffectActive && currentEffect === 'fireworks') {
                        createFirework();
                    }
                }, 500);
                addTimer(timer);
            }else if(currentEffect === 'redPackets'){
                const timer = setInterval(()=>{
                    if(gameState.isEffectActive && currentEffect === 'redPackets') {
                        createRedPacket();
                    }
                }, 200);
                addTimer(timer);
            }else if(currentEffect === 'stockChart'){
                initStockData();
            }else if(currentEffect === 'goldIngots'){
                const timer = setInterval(()=>{
                    if(gameState.isEffectActive && currentEffect === 'goldIngots') {
                        createGoldIngot();
                    }
                }, 100);
                addTimer(timer);
            }
        }

        function stopCurrentEffect(){
            fireworks.length = 0;
            redPackets.length = 0;
            stockData.length = 0;
            goldIngots.length = 0;
            stockChartState.startTime = null;
            stockChartState.completed = false;
            if(window.timers){
                window.timers.forEach(t => clearInterval(t));
                window.timers = [];
            }
            currentEffect = null;
            gameState.isEffectActive = false;
        }

        function addTimer(t){
            if(!window.timers) window.timers = [];
            window.timers.push(t);
        }

        function resetGame() {
            gameState.isBlown = false;
            gameState.isEffectActive = false;
            stopCurrentEffect();
            gameState.canListenForBlow = true;
            gameState.blowCounter = 0;
        }

        function handleCanvasInteraction(event) {
            event.preventDefault(); // 阻止默认行为
            
            // 防止重复触发
            const currentTime = Date.now();
            if (currentTime - gameState.lastInteractionTime < 500) {
                return;
            }
            
            if (gameState.isProcessing) {
                return;
            }
            
            gameState.isProcessing = true;
            gameState.lastInteractionTime = currentTime;
            
            // 如果正在显示特效，先停止特效
            if (gameState.isEffectActive) {
                stopCurrentEffect();
            }
            
            // 重新点燃蜡烛
            resetGame();
            
            // 500ms 后解锁处理状态
            setTimeout(() => {
                gameState.isProcessing = false;
            }, 500);
        }

        function animate(){
            ctx.clearRect(0,0,canvas.width,canvas.height);
            drawCake();
            if(!gameState.isBlown){
                drawFlame();
            } else {
                drawSmoke();
                drawBirthdayText();
                
                // 显示特效
                if(currentEffect === 'fireworks') updateAndDrawFireworks();
                if(currentEffect === 'redPackets') updateAndDrawRedPackets();
                if(currentEffect === 'stockChart') updateAndDrawStockChart();
                if(currentEffect === 'goldIngots') updateAndDrawGoldIngots();
            }
            
            // 麦克风检测 - 只在未吹灭状态下检测
            if (isAudioContextInitialized && !gameState.isBlown && gameState.canListenForBlow) {
                analyser.getByteFrequencyData(dataArray);
                const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;

                if (avg > BLOW_THRESHOLD) {
                    gameState.blowCounter++;
                    if (gameState.blowCounter >= BLOW_FRAMES) {
                        // 吹灭蜡烛
                        gameState.isBlown = true;
                        gameState.canListenForBlow = false;
                        
                        // 触发特效
                        triggerRandomEffect();
                        
                        // 500ms 后重新启用吹气监听（防止立即再次触发）
                        setTimeout(() => {
                            gameState.canListenForBlow = true;
                        }, 500);
                        
                        gameState.blowCounter = 0;
                    }
                } else {
                    gameState.blowCounter = 0; // 音量不够，计数器清零
                }
            }

            animationId = requestAnimationFrame(animate);
        }

        function init(){
            if(isInitialized) return;
            permissionScreen.style.display = 'flex';
            isInitialized = true;
        }

        startScreen.addEventListener('click', () => {
            startScreen.style.display = 'none';
            init();
        });
        
        // 给开始屏幕添加触摸事件支持（手机端）
        startScreen.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startScreen.style.display = 'none';
            init();
        }, { passive: false });

        allowMicBtn.addEventListener('click', initAudio);

        // 添加事件监听器，同时处理鼠标和触摸事件
        canvas.addEventListener('mousedown', handleCanvasInteraction);
        canvas.addEventListener('touchstart', handleCanvasInteraction, { passive: false });

        musicControl.addEventListener('click', toggleBackgroundMusic);

        window.addEventListener('beforeunload', () => {
            stopCurrentEffect();
            if(animationId) cancelAnimationFrame(animationId);
            backgroundMusic.pause();
        });

    </script>
</body>
</html>
